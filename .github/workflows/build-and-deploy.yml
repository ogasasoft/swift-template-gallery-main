name: Build and Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Run npm outdated
        run: npm outdated || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build for production
        run: npm run build

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t swift-template-gallery:${{ github.sha }} \
                       -t swift-template-gallery:latest \
                       -t swift-template-gallery:${{ github.ref_name }} \
                       .

      - name: Build and push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Login to ECR
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

          # Tag and push image
          docker tag swift-template-gallery:${{ github.sha }} \
                       ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/swift-template-gallery:${{ github.sha }}
          docker tag swift-template-gallery:latest \
                       ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/swift-template-gallery:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/swift-template-gallery:${{ github.sha }}
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/swift-template-gallery:latest

      - name: Save Docker image artifact
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker save swift-template-gallery:${{ github.sha }} | gzip > swift-template-gallery-${{ github.sha }}.tar.gz

      - name: Upload artifact
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: swift-template-gallery-${{ github.sha }}.tar.gz
          retention-days: 30

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: .

      - name: Load Docker image
        run: docker load < swift-template-gallery-${{ github.sha }}.tar.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        run: aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Deploy to ECS
        id: deploy
        run: |
          echo "Deploying to ECS cluster: ${{ secrets.ECS_CLUSTER }}"
          echo "Service: ${{ secrets.ECS_SERVICE }}"

          # Update ECS service with new deployment
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

          # Get task definition
          TASK_DEFINITION=$(aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION }} \
            --region ${{ secrets.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "url=https://${{ secrets.ECS_SERVICE }}.${{ secrets.ECS_CLUSTER }}.ecs.${
            secrets.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        run: |
          echo "Waiting for ECS deployment to complete..."
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Check deployment status
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --region ${{ secrets.AWS_REGION }} \
            --query 'services[0].deployments[0].status' \
            --output text)

          echo "Deployment status: $SERVICE_STATUS"

          if [ "$SERVICE_STATUS" != "PRIMARY" ]; then
            echo "Warning: Service is not in PRIMARY state"
            exit 1
          fi

      - name: Notify deployment
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
