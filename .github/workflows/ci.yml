name: CI/CD Pipeline

on:
  push:
    branches: [ main, 'feature/*', 'update/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test-only:
        description: 'Run only tests (skip lint and build)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '18'

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint and auto-fix
        run: npm run lint:fix

      - name: Check for remaining linting issues
        run: npm run lint || echo "Linting issues detected after auto-fix. Please review the output."

      - name: Check Prettier formatting
        run: npm run format:check || echo "Formatting check failed - run 'npm run format' to fix"

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run quality check script
        run: npm run quality

      - name: Upload quality check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-check-report
          path: coverage/quality-check*.txt || echo "No quality check report"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Preview production build
        run: npm run preview

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (strict mode)
        run: npm audit --audit-level=moderate

      - name: Run npm audit --production (only production dependencies)
        run: npm audit --audit-level=moderate --production

      - name: Run Snyk security scan (optional)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t swift-template-gallery .

      - name: Verify Docker image size
        run: |
          IMAGE_SIZE=$(docker images swift-template-gallery --format "{{.Size}}")
          echo "📊 Docker image size: $IMAGE_SIZE"
          # Warn if image is too large (over 1GB)
          if [[ $IMAGE_SIZE == *G* ]]; then
            echo "⚠️  WARNING: Docker image size is large: $IMAGE_SIZE"
          fi

      - name: Run Docker image validation
        run: |
          echo "🔍 Validating Docker image..."

          # Check if Docker image was built successfully
          if docker images | grep -q "swift-template-gallery"; then
            echo "✅ Docker image built successfully"
          else
            echo "❌ ERROR: Docker image not found"
            exit 1
          fi

          # Check if image has non-root user
          if docker image inspect swift-template-gallery --format '{{.Config.User}}' 2>/dev/null | grep -q "nextjs"; then
            echo "✅ Non-root user configured (nextjs)"
          else
            echo "⚠️  WARNING: Non-root user might not be configured"
          fi

          # Check if image exposes port
          if docker image inspect swift-template-gallery --format '{{.Config.ExposedPorts}}' 2>/dev/null | grep -q "5173"; then
            echo "✅ Port 5173 exposed"
          else
            echo "❌ ERROR: Port 5173 not exposed"
            exit 1
          fi

      - name: Cleanup Docker images
        run: docker rmi swift-template-gallery || true

