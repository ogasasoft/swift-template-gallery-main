name: CI/CD Pipeline

on:
  push:
    branches: [ main, 'feature/*', 'update/*', 'fix/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test-only:
        description: 'Run only tests (skip lint and build)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20.x'

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check || echo "Formatting check failed - run 'npm run format' to fix"

      - name: Comment on PR if linting fails
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const result = await getOctokit(${{ secrets.GITHUB_TOKEN }}).rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              check_name: 'Lint Check'
            });

            if (result.data.checks.length > 0) {
              const latestCheck = result.data.checks[0];
              if (latestCheck.conclusion === 'failure') {
                const output = require('fs').readFileSync('eslint-report.txt', 'utf8');
                await getOctokit(${{ secrets.GITHUB_TOKEN }}).rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `## 🔍 Linting Issues Found\n\nPlease review the linting errors:\n\`\`\`\n${output}\n\`\`\`\n\nRun \`npm run lint\` locally to see details.`
                });
              }
            }

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci
        continue-on-error: true

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Comment on PR if tests fail
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const output = require('fs').readFileSync('test-results.txt', 'utf8');
            await getOctokit(${{ secrets.GITHUB_TOKEN }}).rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🧪 Test Failures\n\nPlease review the test failures:\n\n\`\`\`\n${output}\n\`\`\`\n\nRun \`npm test\` locally to see details.`
            });

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Preview production build
        run: npm run preview

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Comment on PR if build fails
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            await getOctokit(${{ secrets.GITHUB_TOKEN }}).rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚠️ Build Failure\n\nThe production build failed. Please check the build logs for details.\n\nRun \`npm run build\` locally to see the full error output.`
            });

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || echo "Security vulnerabilities found. Review manually."

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=high || echo "High severity vulnerabilities found. Review manually."

      - name: Comment on PR if vulnerabilities found
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { stdout } = await getOctokit(${{ secrets.GITHUB_TOKEN }}).rest.git.show({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              headers: { accept: 'application/vnd.github.v3+json' }
            });

            // Simple vulnerability detection - check audit output
            const output = require('fs').readFileSync('npm-audit-report.txt', 'utf8');

            if (output.toLowerCase().includes('vulnerability')) {
              await getOctokit(${{ secrets.GITHUB_TOKEN }}).rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🔒 Security Vulnerabilities Found\n\nPlease review the security audit results:\n\n\`\`\`\n${output}\n\`\`\`\n\nRun \`npm audit\` locally to see details and install updates if needed.`
              });
            }

